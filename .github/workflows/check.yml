# Self-test + shellcheck. No secrets: the test uses throwaway keys it generates itself.
name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools (apt-ftparchive from apt-utils, shellcheck, rpm for rpmbuild/rpmsign)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends apt-utils shellcheck gnupg gpgv xz-utils rpm cpio
      - name: Shellcheck
        run: shellcheck scripts/*.sh
      - name: Nightly ref gate (main / ancestor accepted; branch, tag, foreign commit refused)
        run: scripts/test_nightly_ref.sh
      - name: Key job shape (exactly ONE job with secrets.GPG_ in apt-signing, nothing foreign in it, gate in deploy.needs; protects against MISTAKES, not against someone who can change the workflow, the toolchain or the scripts)
        run: |
          set -euo pipefail
          scripts/check-key-jobs.sh .github/workflows/publish.yml rpm-index-gate
          scripts/check-key-jobs.sh .github/workflows/nightly.yml
          scripts/test_check_key_jobs.sh
      - name: Red test fetch-releases (tagged releases and pre-releases in, the untagged nightly never)
        run: scripts/test_fetch.sh
      - name: Self-test (retention, build, sign, verify, counter-checks)
        run: |
          set -euo pipefail
          out=$(scripts/test_apt.sh)
          echo "$out"
          if grep -q '^SKIPPED' <<< "$out"; then echo "::error::a test part was skipped in CI"; exit 1; fi
      - name: Self-test of the key scripts (pubkey.sh, verify-repomd.sh, check-rpm-signed.sh, check-release-pkg.sh; throwaway keys; no skip in CI)
        run: scripts/test_verify.sh
  check-fedora:
    # The same release-package self-test with the rpm of the target (Fedora 45, rpm 6.1): only here can a %preuntrans package be built and refused (NEED_NEW_RPM=1: no skip).
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:45@sha256:e203b4174f6a2ce6c160ddc4917d85e6bfce32dfc610d953b355d63ec4c17909
    timeout-minutes: 15
    steps:
      - name: Tools
        run: dnf -y -q install rpm rpm-build rpm-sign gnupg2 cpio git tar findutils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Self-test of the key scripts with a new rpm (mode, owner, flags, dependencies, %preuntrans counter-tests; no skip)
        run: NEED_NEW_RPM=1 scripts/test_verify.sh
      - name: freesynergy-filesystem check and unowned-dirs gate (good package passes; counter-packages and a folder without owner are red; no skip)
        run: CI=1 scripts/test_filesystem_pkg.sh
